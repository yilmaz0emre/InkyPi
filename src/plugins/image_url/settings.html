<div class="form-group">
    <label for="url" class="form-label">{{ _('Image URL:') }}</label>
    <input type="text" id="url" name="url" placeholder="{{ _('Type something...') }}" required class="form-input">
</div>

<div class="form-group">
    <span style="color: var(--text-primary);">{{ _('Warning: Do not run with untrusted URLs, as it may pose a security risk. This may also fail if the image takes too long to load.') }}</span>
</div>

<script>
    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {        
        if (loadPluginSettings) {
            document.getElementById('url').value = pluginSettings.url;
        }
    });
</script>
